<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1340" viewBox="0 0 1200 1340" role="img" aria-labelledby="title desc">
<title id="title">B · Configuración paso a paso</title>
<desc id="desc">Tres pasos cortos en el teléfono, con una revisión antes de guardar.</desc>
<rect width="1200" height="1340" fill="#0b1012"/>
<g font-family="Arial,Helvetica,sans-serif">
<text x="54" y="54" font-size="12" fill="#74edbc" font-weight="700" text-anchor="start" letter-spacing="2">GLUCOSA / SIGUIENTE ETAPA</text>
<text x="1146" y="54" font-size="11" fill="#9aabb0" font-weight="600" text-anchor="end" >PROPUESTA · ANTES DE IMPLEMENTAR</text>
<text x="54" y="115" font-size="36" fill="#f2f7f6" font-weight="700" text-anchor="start" >B · Configuración paso a paso</text>
<text x="54" y="151" font-size="17" fill="#9aabb0" font-weight="400" text-anchor="start" >Tres pasos cortos en el teléfono, con una revisión antes de guardar.</text>
<rect x="54" y="207" width="348" height="846" rx="20" fill="#121a1e" stroke="#26343a"/>
<text x="78" y="251" font-size="24" fill="#f2f7f6" font-weight="700" text-anchor="start" >glucosa.</text>
<text x="78" y="294" font-size="10" fill="#74edbc" font-weight="700" text-anchor="start" letter-spacing="1">PASO 1 DE 3</text>
<text x="78" y="338" font-size="25" fill="#f2f7f6" font-weight="700" text-anchor="start" >Tu Wi-Fi</text>
<text x="78" y="370" font-size="13" fill="#9aabb0" font-weight="400" text-anchor="start" >Conecta el Wemos a tu red.</text>
<rect x="78" y="391" width="94" height="4" rx="2" fill="#74edbc" stroke="none"/>
<rect x="180" y="391" width="94" height="4" rx="2" fill="#26343a" stroke="none"/>
<rect x="282" y="391" width="94" height="4" rx="2" fill="#26343a" stroke="none"/>
<text x="78" y="446" font-size="13" fill="#d3e0dd" font-weight="600" text-anchor="start" >Nombre de tu Wi-Fi</text>
