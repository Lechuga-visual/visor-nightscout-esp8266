<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200" role="img" aria-labelledby="title desc">
<title id="title">B · Bienvenida con estado</title>
<desc id="desc">Tres etapas reales para reconocer dónde va la conexión.</desc>
<rect width="1200" height="1200" fill="#0b1012"/>
<g font-family="Arial,Helvetica,sans-serif">
<text x="54" y="54" font-size="12" fill="#74edbc" font-weight="700" text-anchor="start" letter-spacing="2">GLUCOSA / SIGUIENTE ETAPA</text>
<text x="1146" y="54" font-size="11" fill="#9aabb0" font-weight="600" text-anchor="end" >PROPUESTA · ANTES DE IMPLEMENTAR</text>
<text x="54" y="115" font-size="36" fill="#f2f7f6" font-weight="700" text-anchor="start" >B · Bienvenida con estado</text>
<text x="54" y="151" font-size="17" fill="#9aabb0" font-weight="400" text-anchor="start" >Tres etapas reales para reconocer dónde va la conexión.</text>
<text x="54" y="218" font-size="11" fill="#9aabb0" font-weight="700" text-anchor="start" letter-spacing="1.2">AL ENCENDER CON DATOS GUARDADOS</text>
<text x="648" y="218" font-size="11" fill="#9aabb0" font-weight="700" text-anchor="start" letter-spacing="1.2">CUANDO NECESITA CONFIGURACIÓN</text>
<svg x="64" y="256" width="460" height="460" viewBox="0 0 240 240"><circle cx="120" cy="120" r="119" fill="#0b1114" stroke="#26343a"/><circle cx="120" cy="120" r="114" fill="none" stroke="#74edbc" stroke-width="1.5"/><g transform="translate(120 48) scale(0.8)" fill="none" stroke="#74edbc" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M-15 0H-8L-3-10 3 10 8 0H15"/></g><text x="120" y="92" font-size="22" fill="#f2f7f6" font-weight="700" text-anchor="middle" >Hola, Alex</text><circle cx="66" cy="121" r="5" fill="#74edbc"/><path d="M63.5 121l2 2 3.5-4" fill="none" stroke="#08251a" stroke-width="1.4"/><text x="80" y="125" font-size="9" fill="#d3e0dd" font-weight="400" text-anchor="start" >Wi-Fi conectado</text><circle cx="66" cy="147" r="5" fill="none" stroke="#74edbc"/><text x="80" y="151" font-size="9" fill="#74edbc" font-weight="400" text-anchor="start" >Consultando servidor</text><circle cx="66" cy="173" r="5" fill="none" stroke="#485d63"/><text x="80" y="177" font-size="9" fill="#9aabb0" font-weight="400" text-anchor="start" >Esperando lectura</text><text x="120" y="207" font-size="7" fill="#9aabb0" font-weight="400" text-anchor="middle" >Preparando tu pantalla</text></svg>
<svg x="660" y="256" width="460" height="460" viewBox="0 0 240 240"><circle cx="120" cy="120" r="119" fill="#0b1114" stroke="#26343a"/><circle cx="120" cy="120" r="114" fill="none" stroke="#74edbc" stroke-width="1.5"/><text x="120" y="34" font-size="12" fill="#74edbc" font-weight="700" text-anchor="middle" >CONFIGURAR</text><circle cx="50" cy="70" r="8" fill="#1b352a"/><text x="50" y="73" font-size="8" fill="#74edbc" font-weight="700" text-anchor="middle" >1</text><text x="67" y="63" font-size="7" fill="#9aabb0" font-weight="400" text-anchor="start" >Conecta a esta Wi-Fi</text><text x="67" y="82" font-size="10.5" fill="#f2f7f6" font-weight="600" text-anchor="start" >glucosa-ABCDEF</text><circle cx="50" cy="120" r="8" fill="#1b352a"/><text x="50" y="123" font-size="8" fill="#74edbc" font-weight="700" text-anchor="middle" >2</text><text x="67" y="113" font-size="7" fill="#9aabb0" font-weight="400" text-anchor="start" >Usa esta clave</text><text x="67" y="132" font-size="10.5" fill="#f2f7f6" font-weight="600" text-anchor="start" >ABCD1234EFGH</text><circle cx="50" cy="170" r="8" fill="#1b352a"/><text x="50" y="173" font-size="8" fill="#74edbc" font-weight="700" text-anchor="middle" >3</text><text x="67" y="163" font-size="7" fill="#9aabb0" font-weight="400" text-anchor="start" >Abre en el navegador</text><text x="67" y="182" font-size="10.5" fill="#f2f7f6" font-weight="600" text-anchor="start" >192.168.4.1</text><text x="120" y="217" font-size="6.5" fill="#9aabb0" font-weight="400" text-anchor="middle" >Sigue los pasos en tu teléfono</text></svg>
<rect x="54" y="764" width="1092" height="182" rx="18" fill="#121a1e" stroke="#26343a"/>
<text x="80" y="805" font-size="11" fill="#9aabb0" font-weight="700" text-anchor="start" letter-spacing="1.3">COMPORTAMIENTO PROPUESTO</text>
<text x="80" y="843" font-size="19" fill="#f2f7f6" font-weight="600" text-anchor="start" >El estado avanza al conectar; no muestra progreso ni lecturas inventadas.</text>
<text x="80" y="877" font-size="15" fill="#9aabb0" font-weight="400" text-anchor="start" >Si una etapa tarda, indica qué está esperando. Si falla, ofrece un mensaje claro.</text>
<text x="80" y="908" font-size="15" fill="#9aabb0" font-weight="400" text-anchor="start" >La clave de la red temporal y la contraseña de tu Wi-Fi se presentan como datos distintos.</text>
<text x="54" y="1002" font-size="21" fill="#f2f7f6" font-weight="600" text-anchor="start" >Mis colores, desde el arranque</text>
<text x="54" y="1036" font-size="16" fill="#9aabb0" font-weight="400" text-anchor="start" >En un equipo configurado se usaría el tema guardado. En el primer inicio, menta.</text>
<text x="54" y="1070" font-size="16" fill="#9aabb0" font-weight="400" text-anchor="start" >El nombre tendría el tamaño grande. La pantalla redonda informa; los pasos se hacen en el teléfono.</text>
<text x="54" y="1168" font-size="11" fill="#6f858c" font-weight="400" text-anchor="start" >Maqueta estática · Nombres, redes y claves de ejemplo · Firmware de esta propuesta pendiente de elección</text>
</g></svg>
