<text x="192" y="253" font-size="11" fill="#9aabb0" font-weight="700" text-anchor="start" letter-spacing="1.4">AJUSTES / PANTALLA</text>
<text x="192" y="298" font-size="29" fill="#f2f7f6" font-weight="600" text-anchor="start" >Un brillo más suave por la noche</text>
<text x="192" y="335" font-size="15" fill="#9aabb0" font-weight="400" text-anchor="start" >El horario se aplicaría en la zona horaria seleccionada.</text>
<text x="192" y="391" font-size="17" fill="#f2f7f6" font-weight="600" text-anchor="start" >Activar horario nocturno</text>
<rect x="938" y="367" width="68" height="34" rx="17" fill="#74edbc" stroke="none"/>
<circle cx="987" cy="384" r="12" fill="#08251a"/>
