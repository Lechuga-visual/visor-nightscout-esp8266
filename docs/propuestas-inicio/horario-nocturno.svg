<rect x="594" y="465" width="412" height="44" rx="8" fill="#0b1114" stroke="#35484e"/>
<text x="607" y="493" font-size="14" fill="#d3e0dd" font-weight="400" text-anchor="start" >07:00</text>
<text x="192" y="558" font-size="13" fill="#d3e0dd" font-weight="600" text-anchor="start" >Zona horaria</text>
<rect x="192" y="569" width="814" height="44" rx="8" fill="#0b1114" stroke="#35484e"/>
<text x="205" y="597" font-size="14" fill="#d3e0dd" font-weight="400" text-anchor="start" >Santiago de Chile · America/Santiago</text>
