<title id="title">Horario nocturno desde la web</title>
<desc id="desc">Propuesta para Ajustes · Atenuación del contenido de la pantalla.</desc>
<rect width="1200" height="1320" fill="#0b1012"/>
<g font-family="Arial,Helvetica,sans-serif">
