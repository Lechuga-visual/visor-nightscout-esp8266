<text x="1146" y="54" font-size="11" fill="#9aabb0" font-weight="600" text-anchor="end" >PROPUESTA · ANTES DE IMPLEMENTAR</text>
<text x="54" y="115" font-size="36" fill="#f2f7f6" font-weight="700" text-anchor="start" >Horario nocturno desde la web</text>
<text x="54" y="151" font-size="17" fill="#9aabb0" font-weight="400" text-anchor="start" >Propuesta para Ajustes · Atenuación del contenido de la pantalla.</text>
