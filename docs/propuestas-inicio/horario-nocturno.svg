<text x="1006" y="801" font-size="16" fill="#74edbc" font-weight="700" text-anchor="end" >25 %</text>
<rect x="204" y="831" width="756" height="7" rx="3" fill="#26343a" stroke="none"/>
<rect x="204" y="831" width="189" height="7" rx="3" fill="#74edbc" stroke="none"/>
<circle cx="393" cy="834.5" r="9" fill="#74edbc"/>
<rect x="192" y="883" width="814" height="112" rx="10" fill="#182328" stroke="#26343a"/>
<text x="214" y="913" font-size="15" fill="#d3e0dd" font-weight="600" text-anchor="start" >En este módulo se atenuaría lo dibujado.</text>
<text x="214" y="942" font-size="13" fill="#9aabb0" font-weight="400" text-anchor="start" >La luz de fondo seguiría encendida. Controlarla requiere revisar el hardware.</text>
<text x="214" y="971" font-size="13" fill="#9aabb0" font-weight="400" text-anchor="start" >Sin hora válida, se mantendría la intensidad de día y se mostraría un aviso.</text>
<rect x="192" y="1028" width="376" height="54" rx="9" fill="#182328" stroke="#35484e"/>
<text x="380" y="1062" font-size="14" fill="#d3e0dd" font-weight="600" text-anchor="middle" >Probar durante 5 segundos</text>
<rect x="594" y="1028" width="412" height="54" rx="9" fill="#74edbc" stroke="none"/>
<text x="800" y="1062" font-size="14" fill="#08251a" font-weight="700" text-anchor="middle" >Guardar horario</text>
<text x="192" y="1138" font-size="13" fill="#9aabb0" font-weight="400" text-anchor="start" >El ejemplo 22:00–07:00 cruza medianoche; los horarios y niveles serían editables.</text>
<text x="54" y="1245" font-size="14" fill="#9aabb0" font-weight="400" text-anchor="start" >Una disminución de la luz de fondo real queda sujeta al control eléctrico disponible en el módulo.</text>
<text x="54" y="1288" font-size="11" fill="#6f858c" font-weight="400" text-anchor="start" >Maqueta estática · Nombres, redes y claves de ejemplo · Firmware de esta propuesta pendiente de elección</text>
