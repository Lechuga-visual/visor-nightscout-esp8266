<text x="1305" y="1399" class="pin" text-anchor="middle" style="fill:#a33ca0">RST / RES</text>
<text x="80" y="1490" class="small">Los colores ayudan a seguir el dibujo: el cable puede ser de otro color.</text>
<rect x="50" y="1545" width="1500" height="150" rx="20" fill="#e5edf6"/>
<text x="80" y="1587" class="pin">VCC → 3V3, nunca 5V.    RST de pantalla → D0, no RST del Wemos.</text>
<text x="80" y="1628" class="body">SCL y SDA son SPI en esta pantalla. No se conectan como I²C. No necesita MISO.</text>
<text x="80" y="1666" class="body">Alimenta el Wemos por USB después de revisar todo el cableado.</text>
<text x="60" y="1735" class="small">Esquema ilustrativo · Sigue las etiquetas de tus módulos · Guía completa: docs/INSTALACION.md</text>
