<text x="54" y="115" font-size="38" fill="#f2f7f6" font-weight="700" text-anchor="start" >Cinco temas. Tu combinación.</text>
<text x="54" y="151" font-size="18" fill="#9aabb0" font-weight="400" text-anchor="start" >Elige uno de los colores o crea el tuyo desde la interfaz web.</text>
