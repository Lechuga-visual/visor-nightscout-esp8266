<title id="title">Cinco temas y colores personalizados</title>
<desc id="desc">Propuesta estática de temas menta, rojo, azul, rosado y celeste, y un panel para personalizar acento, fondo y número desde Ajustes. Las cifras son ejemplos.</desc>
