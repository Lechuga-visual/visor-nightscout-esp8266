[platformio]
default_envs = d1_mini

[env:d1_mini]
platform = espressif8266@4.2.1
board = d1_mini
framework = arduino
monitor_speed = 115200
board_build.filesystem = littlefs
build_src_filter = +<*> -<public_ca_store.cpp> -<sd_pro_transition.cpp>
lib_deps =
    bodmer/TFT_eSPI@2.5.43
    bblanchon/ArduinoJson@6.21.5
build_flags =
    -D USER_SETUP_LOADED=1
    -D GC9A01_DRIVER=1
    -D TFT_WIDTH=240
    -D TFT_HEIGHT=240
    -D TFT_MISO=-1
    -D TFT_MOSI=13
    -D TFT_SCLK=14
    -D TFT_CS=4
    -D TFT_DC=5
    -D TFT_RST=16
    -D LOAD_GLCD=1
    -D LOAD_FONT2=1
    -D LOAD_FONT4=1
    -D SPI_FREQUENCY=27000000

[env:sd_pro]
extends = env:d1_mini
board_build.flash_mode = dio
build_flags =
    -D USER_SETUP_LOADED=1
    -D ST7789_DRIVER=1
    -D SD_PRO_SQUARE_DISPLAY=1
    -D TFT_WIDTH=240
    -D TFT_HEIGHT=240
    -D TFT_MISO=-1
    -D TFT_MOSI=13
    -D TFT_SCLK=14
    -D TFT_CS=15
    -D TFT_DC=0
    -D TFT_RST=2
    -D TFT_BL=5
    -D TFT_BACKLIGHT_ON=LOW
    -D TFT_RGB_ORDER=TFT_RGB
    -D TFT_INVERSION_ON=1
    -D LOAD_GLCD=1
    -D LOAD_FONT2=1
    -D LOAD_FONT4=1
    -D SPI_FREQUENCY=27000000

[env:sd_pro_transition]
extends = env:sd_pro
board_build.ldscript = eagle.flash.4m1m.ld
build_src_filter = -<*> +<sd_pro_transition.cpp>
